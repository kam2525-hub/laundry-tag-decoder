<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>洗濯表示スマート解読・お手入れ手順ジェネレーター</title>
    <style>
        :root {
            --bg-primary: #f1f5f9;
            --bg-secondary: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-light: #dbeafe;
            --border-color: #cbd5e1;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --radius-sm: 0.375rem;
            --radius-md: 0.75rem;
            --radius-lg: 1rem;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #3b82f6;
            --accent-hover: #60a5fa;
            --accent-light: #1e3a8a;
            --border-color: #334155;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.5);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.3), 0 2px 4px -2px rgb(0 0 0 / 0.3);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.4), 0 4px 6px -4px rgb(0 0 0 / 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            transition: var(--transition);
            padding-bottom: 3rem;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 1.5rem;
        }

        /* ヘッダー */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .logo h1 {
            font-size: 1.75rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-color), #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo p {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        .header-controls {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        /* 共通ボタン */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.625rem 1.25rem;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid transparent;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            border-color: var(--border-color);
        }

        .btn-secondary:hover {
            background-color: var(--bg-primary);
        }

        .btn-icon {
            padding: 0.625rem;
            border-radius: var(--radius-md);
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* クイックセレクター */
        .quick-selector {
            background-color: var(--bg-secondary);
            padding: 1rem 1.5rem;
            border-radius: var(--radius-lg);
            margin-bottom: 2rem;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .quick-selector-title {
            font-size: 0.875rem;
            font-weight: 700;
            color: var(--text-secondary);
        }

        .preset-tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .preset-tag {
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            padding: 0.375rem 0.875rem;
            border-radius: 2rem;
            font-size: 0.813rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .preset-tag:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        /* メインレイアウト */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        @media (min-width: 1024px) {
            .main-layout {
                grid-template-columns: 1.2fr 0.8fr;
                align-items: start;
            }
        }

        /* 記号選択ボード */
        .selection-board {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .category-card {
            background-color: var(--bg-secondary);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }

        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--bg-primary);
        }

        .category-title {
            font-size: 1.125rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .category-badge {
            font-size: 0.75rem;
            background-color: var(--accent-light);
            color: var(--accent-color);
            padding: 0.25rem 0.5rem;
            border-radius: var(--radius-sm);
            font-weight: 600;
        }

        .symbol-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 0.75rem;
        }

        /* 洗濯記号ボタン */
        .symbol-btn {
            background-color: var(--bg-primary);
            border: 2px solid transparent;
            border-radius: var(--radius-md);
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0.5rem;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
        }

        .symbol-btn svg {
            width: 48px;
            height: 48px;
            stroke-width: 4;
            color: var(--text-primary);
            transition: var(--transition);
        }

        .symbol-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: var(--border-color);
        }

        .symbol-btn.active {
            background-color: var(--accent-light);
            border-color: var(--accent-color);
        }

        .symbol-btn.active svg {
            color: var(--accent-color);
        }

        .symbol-tooltip {
            position: absolute;
            bottom: -5px;
            background-color: rgba(15, 23, 42, 0.9);
            color: #ffffff;
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
            border-radius: var(--radius-sm);
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transform: translateY(5px);
            transition: var(--transition);
            z-index: 10;
        }

        .symbol-btn:hover .symbol-tooltip {
            opacity: 1;
            transform: translateY(100%);
        }

        /* 結果表示エリア（Sticky） */
        .result-sticky {
            position: sticky;
            top: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .result-card {
            background-color: var(--bg-secondary);
            border-radius: var(--radius-lg);
            padding: 1.75rem;
            box-shadow: var(--shadow-lg);
            border: 2px solid var(--accent-color);
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1.5rem;
        }

        .result-title {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        .selected-preview {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
            min-height: 50px;
            padding: 0.75rem;
            background-color: var(--bg-primary);
            border-radius: var(--radius-md);
            align-items: center;
        }

        .preview-icon {
            width: 36px;
            height: 36px;
            background: var(--bg-secondary);
            border-radius: var(--radius-sm);
            padding: 4px;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .preview-icon svg {
            width: 100%;
            height: 100%;
        }

        .preview-empty {
            color: var(--text-secondary);
            font-size: 0.875rem;
            text-align: center;
            width: 100%;
        }

        /* お手入れ手順（タイムライン形式） */
        .timeline {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .timeline-item {
            position: relative;
            padding-left: 1.75rem;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: 5px;
            top: 6px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--accent-color);
        }

        .timeline-item::after {
            content: '';
            position: absolute;
            left: 9px;
            top: 20px;
            bottom: -20px;
            width: 2px;
            background-color: var(--border-color);
        }

        .timeline-item:last-child::after {
            display: none;
        }

        .timeline-title {
            font-weight: 700;
            font-size: 0.938rem;
            margin-bottom: 0.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .timeline-desc {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .warning-text {
            color: var(--danger-color);
            font-weight: 600;
        }

        /* レシピ保存エリア */
        .recipe-save-form {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 0.5rem;
        }

        .recipe-input {
            flex: 1;
            padding: 0.625rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-size: 0.875rem;
        }

        .recipe-input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        /* 保存されたレシピ一覧 */
        .saved-recipes-card {
            background-color: var(--bg-secondary);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }

        .recipe-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-top: 1rem;
            max-height: 200px;
            overflow-y: auto;
        }

        .recipe-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0.75rem;
            background-color: var(--bg-primary);
            border-radius: var(--radius-md);
            font-size: 0.875rem;
        }

        .recipe-info {
            cursor: pointer;
            font-weight: 600;
            flex: 1;
        }

        .recipe-delete {
            color: var(--danger-color);
            cursor: pointer;
            background: none;
            border: none;
            padding: 0.25rem;
        }

        /* 印刷・モーダル用ユーティリティ */
        .actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }

        /* レスポンシブ調整 */
        @media (max-width: 640px) {
            .logo h1 { font-size: 1.5rem; }
            .container { padding: 1rem; }
            .category-card { padding: 1rem; }
            .symbol-grid { grid-template-columns: repeat(4, 1fr); }
            .actions-grid { grid-template-columns: 1fr; }
        }

        /* 印刷スタイル */
        @media print {
            body { background: #ffffff; color: #000000; }
            .container { max-width: 100%; padding: 0; }
            header, .quick-selector, .selection-board, .recipe-save-form, .actions-grid, .saved-recipes-card {
                display: none !important;
            }
            .result-card {
                border: none;
                box-shadow: none;
                padding: 0;
            }
            .timeline-item::after { background-color: #000000; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- ヘッダー -->
    <header>
        <div class="logo">
            <h1>
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent-color);"><path d="M12 22a7 7 0 0 0 5-11.89l-5-5-5 5A7 7 0 0 0 12 22z"/></svg>
                洗濯表示スマート解読
            </h1>
            <p>記号をタップするだけで、最適なお手入れ手順をAI感覚で瞬時に生成</p>
        </div>
        <div class="header-controls">
            <button class="btn-icon" id="theme-toggle" title="ダークモード切り替え">
                <svg id="theme-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m11.314 11.314l.707.707M12 5a7 7 0 1 0 0 14 7 7 0 0 0 0-14z"/></svg>
            </button>
        </div>
    </header>

    <!-- クイックセレクター -->
    <section class="quick-selector">
        <span class="quick-selector-title">衣類別クイックセット:</span>
        <div class="preset-tags" id="presets-container">
            <!-- JSで動的生成 -->
        </div>
    </section>

    <!-- メインコンテンツ -->
    <main class="main-layout">
        
        <!-- 左側：洗濯タグ記号選択ボード -->
        <section class="selection-board" id="selection-board">
            <!-- カテゴリ：洗い方 -->
            <div class="category-card" data-category="wash">
                <div class="category-header">
                    <h3 class="category-title">
                        <svg width="20" height="20" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6"><path d="M15,35 Q20,30 30,35 Q40,40 50,35 Q60,30 70,35 Q80,40 85,35 L80,75 C80,80 75,85 70,85 L30,85 C25,85 20,80 20,75 Z" stroke-linejoin="round"/></svg>
                        1. 洗い方（家庭洗濯）
                    </h3>
                    <span class="category-badge">いずれか1つ</span>
                </div>
                <div class="symbol-grid" id="grid-wash"></div>
            </div>

            <!-- カテゴリ：漂白 -->
            <div class="category-card" data-category="bleach">
                <div class="category-header">
                    <h3 class="category-title">
                        <svg width="20" height="20" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6"><polygon points="50,15 85,80 15,80" stroke-linejoin="round"/></svg>
                        2. 漂白
                    </h3>
                    <span class="category-badge">いずれか1つ</span>
                </div>
                <div class="symbol-grid" id="grid-bleach"></div>
            </div>

            <!-- カテゴリ：乾燥（タンブル） -->
            <div class="category-card" data-category="tumble">
                <div class="category-header">
                    <h3 class="category-title">
                        <svg width="20" height="20" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6"><rect x="20" y="20" width="60" height="60" rx="6"/><circle cx="50" cy="50" r="20"/></svg>
                        3. タンブル乾燥（乾燥機）
                    </h3>
                    <span class="category-badge">いずれか1つ</span>
                </div>
                <div class="symbol-grid" id="grid-tumble"></div>
            </div>

            <!-- カテゴリ：自然乾燥 -->
            <div class="category-card" data-category="natural-dry">
                <div class="category-header">
                    <h3 class="category-title">
                        <svg width="20" height="20" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6"><rect x="20" y="20" width="60" height="60" rx="6"/><line x1="50" y1="28" x2="50" y2="72"/></svg>
                        4. 干し方（自然乾燥）
                    </h3>
                    <span class="category-badge">いずれか1つ</span>
                </div>
                <div class="symbol-grid" id="grid-natural-dry"></div>
            </div>

            <!-- カテゴリ：アイロン -->
            <div class="category-card" data-category="iron">
                <div class="category-header">
                    <h3 class="category-title">
                        <svg width="20" height="20" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6"><path d="M25 65 L75 65 C82 65 85 55 80 45 C75 35 60 35 55 35 L30 35 C25 35 25 40 25 45 Z M30 35 L30 25 L60 25" stroke-linejoin="round"/></svg>
                        5. アイロン仕上げ
                    </h3>
                    <span class="category-badge">いずれか1つ</span>
                </div>
                <div class="symbol-grid" id="grid-iron"></div>
            </div>

            <!-- カテゴリ：クリーニング -->
            <div class="category-card" data-category="cleaning">
                <div class="category-header">
                    <h3 class="category-title">
                        <svg width="20" height="20" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6"><circle cx="50" cy="50" r="30"/></svg>
                        6. クリーニング
                    </h3>
                    <span class="category-badge">いずれか1つ</span>
                </div>
                <div class="symbol-grid" id="grid-cleaning"></div>
            </div>
        </section>

        <!-- 右側：リアルタイム解析＆手順書生成 -->
        <section class="result-sticky">
            <div class="result-card" id="result-card">
                <div class="result-header">
                    <h3 class="result-title">✨ 最適なお手入れ手順書</h3>
                </div>

                <!-- 選択中の記号プレビュー -->
                <div class="selected-preview" id="selected-preview">
                    <div class="preview-empty">左側の記号をタップして選択してください</div>
                </div>

                <!-- 動的生成される手順タイムライン -->
                <div class="timeline" id="procedure-timeline">
                    <!-- JSで動的に追加 -->
                </div>

                <!-- レシピの保存 -->
                <div class="recipe-save-form">
                    <input type="text" class="recipe-input" id="recipe-name" placeholder="例: お気に入りのウールセーター" aria-label="衣類の名前">
                    <button class="btn btn-primary" id="save-recipe-btn">手順を保存</button>
                </div>

                <div class="actions-grid">
                    <button class="btn btn-secondary" id="reset-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8 M3 3v5h5"/></svg>
                        リセット
                    </button>
                    <button class="btn btn-secondary" id="print-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
                        印刷 / PDF
                    </button>
                </div>
            </div>

            <!-- 保存したレシピ一覧 -->
            <div class="saved-recipes-card">
                <h4 style="font-weight: 700; margin-bottom: 0.5rem; display:flex; align-items:center; gap:0.5rem;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
                    マイ衣類レシピ（保存履歴）
                </h4>
                <ul class="recipe-list" id="saved-recipes-list">
                    <!-- JSで動的生成 -->
                </ul>
            </div>
        </section>

    </main>
</div>

<script>
    // --- 洗濯表示記号データ定義 ---
    const SYMBOLS_DATA = {
        wash: [
            { id: 'wash-95', name: '洗濯機(95℃制限)', desc: '液温は95℃を限度とし、洗濯機で通常の洗濯ができる。', icon: `<svg viewBox="0 0 100 100"><path d="M15,35 Q20,30 30,35 Q40,40 50,35 Q60,30 70,35 Q80,40 85,35 L80,75 C80,80 75,85 70,85 L30,85 C25,85 20,80 20,75 Z" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/><text x="50" y="65" font-size="22" font-family="sans-serif" font-weight="900" text-anchor="middle" fill="currentColor">95</text></svg>`, advice: '非常に高温で洗えます。煮沸消毒が可能です。' },
            { id: 'wash-60', name: '洗濯機(60℃制限)', desc: '液温は60℃を限度とし、洗濯機で通常の洗濯ができる。', icon: `<svg viewBox="0 0 100 100"><path d="M15,35 Q20,30 30,35 Q40,40 50,35 Q60,30 70,35 Q80,40 85,35 L80,75 C80,80 75,85 70,85 L30,85 C25,85 20,80 20,75 Z" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/><text x="50" y="65" font-size="22" font-family="sans-serif" font-weight="900" text-anchor="middle" fill="currentColor">60</text></svg>`, advice: '温水で洗うことで皮脂汚れやダニ対策に効果的です。' },

            { id: 'iron-low', name: '低温(110℃制限)', desc: '底面温度110℃を限度としてアイロン仕上げができる(スチームなし)。', icon: `<svg viewBox="0 0 100 100"><path d="M25 65 L75 65 C82 65 85 55 80 45 C75 35 60 35 55 35 L30 35 C25 35 25 40 25 45 Z M30 35 L30 25 L60 25" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/><circle cx="50" cy="53" r="3" fill="currentColor"/></svg>`, advice: 'アクリル、シルク、ナイロンなど。熱に非常に弱いため、必ず極低温に設定し、<span class="warning-text">スチームはオフ</span>にしてください。あて布必須です。' },
            { id: 'iron-prohibit', name: 'アイロン禁止', desc: 'アイロン仕上げはできない。', icon: `<svg viewBox="0 0 100 100"><path d="M25 65 L75 65 C82 65 85 55 80 45 C75 35 60 35 55 35 L30 35 C25 35 25 40 25 45 Z M30 35 L30 25 L60 25" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/><line x1="10" y1="10" x2="90" y2="90" stroke="var(--danger-color)" stroke-width="8"/><line x1="90" y1="10" x2="10" y2="90" stroke="var(--danger-color)" stroke-width="8"/></svg>`, advice: '<span class="warning-text">アイロンは一切使用できません。</span>繊維が溶けたり、変色したりします。シワを伸ばす場合は、浴室に吊るして湿気を吸わせるなどの工夫を。' }
        ],
        cleaning: [
            { id: 'clean-dry-p', name: 'ドライ(P)', desc: 'パークロロエチレン及び石油系溶剤による弱いドライクリーニングができる。', icon: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="30" fill="none" stroke="currentColor" stroke-width="6"/><text x="50" y="58" font-size="24" font-family="sans-serif" font-weight="900" text-anchor="middle" fill="currentColor">P</text><line x1="20" y1="88" x2="80" y2="88" stroke="currentColor" stroke-width="6" stroke-linecap="round"/></svg>`, advice: '一般的なドライクリーニングが可能です。お店で「ドライクリーニング」を依頼してください。' },
            { id: 'clean-dry-f', name: 'ドライ(F)', desc: '石油系溶剤による弱いドライクリーニングができる。', icon: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="30" fill="none" stroke="currentColor" stroke-width="6"/><text x="50" y="58" font-size="24" font-family="sans-serif" font-weight="900" text-anchor="middle" fill="currentColor">F</text><line x1="20" y1="88" x2="80" y2="88" stroke="currentColor" stroke-width="6" stroke-linecap="round"/></svg>`, advice: 'デリケートな素材用のドライクリーニングです。石油系の優しい溶剤を使用するようお店にお伝えください。' },
            { id: 'clean-wet-w', name: 'ウェットクリーニング', desc: 'プロによる弱い操作のウエットクリーニングができる。', icon: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="30" fill="none" stroke="currentColor" stroke-width="6"/><text x="50" y="58" font-size="24" font-family="sans-serif" font-weight="900" text-anchor="middle" fill="currentColor">W</text><line x1="20" y1="88" x2="80" y2="88" stroke="currentColor" stroke-width="6" stroke-linecap="round"/></svg>`, advice: 'クリーニング店での高度な水洗い（ウェットクリーニング）が可能です。汗抜きなどに有効です。' },
            { id: 'clean-prohibit', name: 'クリーニング禁止', desc: 'ドライクリーニング・ウェットクリーニング不可。', icon: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="30" fill="none" stroke="currentColor" stroke-width="6"/><line x1="10" y1="10" x2="90" y2="90" stroke="var(--danger-color)" stroke-width="8"/><line x1="90" y1="10" x2="10" y2="90" stroke="var(--danger-color)" stroke-width="8"/></svg>`, advice: 'プロのクリーニング店でもドライ・水洗い共に難しい衣類です。特殊なケアが必要な場合があります。' }
        ]
    };

    // --- プリセット（衣類別クイックセット）データ ---
    const PRESETS = [
        { name: '綿Tシャツ', symbols: { wash: 'wash-40', bleach: 'bleach-oxygen', tumble: 'tumble-prohibit', 'natural-dry': 'dry-hang', iron: 'iron-high', cleaning: null } },
        { name: 'ウールセーター', symbols: { wash: 'wash-hand', bleach: 'bleach-prohibit', tumble: 'tumble-prohibit', 'natural-dry': 'dry-flat-shade', iron: 'iron-mid', cleaning: 'clean-dry-f' } },
        { name: 'シルクブラウス', symbols: { wash: 'wash-30-veryweak', bleach: 'bleach-prohibit', tumble: 'tumble-prohibit', 'natural-dry': 'dry-hang-shade', iron: 'iron-low', cleaning: 'clean-dry-f' } },
        { name: 'ダウンジャケット', symbols: { wash: 'wash-hand', bleach: 'bleach-prohibit', tumble: 'tumble-low', 'natural-dry': 'dry-flat-shade', iron: 'iron-prohibit', cleaning: 'clean-wet-w' } },
        { name: 'ポリエステルパーカー', symbols: { wash: 'wash-40-weak', bleach: 'bleach-oxygen', tumble: 'tumble-low', 'natural-dry': 'dry-hang', iron: 'iron-mid', cleaning: null } }
    ];

    // --- アプリケーション状態管理 ---
    let state = {
        selected: {
            wash: null,
            bleach: null,
            tumble: null,
            'natural-dry': null,
            iron: null,
            cleaning: null
        },
        savedRecipes: []
    };

    // --- DOM要素 ---
    const selectionBoard = document.getElementById('selection-board');
    const selectedPreview = document.getElementById('selected-preview');
    const procedureTimeline = document.getElementById('procedure-timeline');
    const presetsContainer = document.getElementById('presets-container');
    const saveRecipeBtn = document.getElementById('save-recipe-btn');
    const recipeNameInput = document.getElementById('recipe-name');
    const savedRecipesList = document.getElementById('saved-recipes-list');
    const resetBtn = document.getElementById('reset-btn');
    const printBtn = document.getElementById('print-btn');
    const themeToggle = document.getElementById('theme-toggle');

    // --- 初期化処理 ---
    function init() {
        renderSymbolGrids();
        renderPresets();
        loadLocalStorage();
        updateUI();

        // イベントリスナー登録
        resetBtn.addEventListener('click', resetSelection);
        printBtn.addEventListener('click', () => window.print());
        saveRecipeBtn.addEventListener('click', saveRecipe);
        themeToggle.addEventListener('click', toggleTheme);
    }

    // --- テーマ切り替え ---
    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('laundry_theme', newTheme);
    }

    // --- ローカルストレージからの読み込み ---
    function loadLocalStorage() {
        const savedState = localStorage.getItem('laundry_state');
        if (savedState) {
            state.selected = JSON.parse(savedState);
        }
        const savedRecipes = localStorage.getItem('laundry_recipes');
        if (savedRecipes) {
            state.savedRecipes = JSON.parse(savedRecipes);
        }
        const savedTheme = localStorage.getItem('laundry_theme');
        if (savedTheme) {
            document.documentElement.setAttribute('data-theme', savedTheme);
        }
    }

    // --- ローカルストレージへの保存 ---
    function saveStateToStorage() {
        localStorage.setItem('laundry_state', JSON.stringify(state.selected));
    }

    function saveRecipesToStorage() {
        localStorage.setItem('laundry_recipes', JSON.stringify(state.savedRecipes));
    }

    // --- 記号グリッドの描画 ---
    function renderSymbolGrids() {
        Object.keys(SYMBOLS_DATA).forEach(category => {
            const grid = document.getElementById(`grid-${category}`);
            grid.innerHTML = '';
            
            SYMBOLS_DATA[category].forEach(symbol => {
                const btn = document.createElement('button');
                btn.className = 'symbol-btn';
                btn.dataset.category = category;
                btn.dataset.id = symbol.id;
                btn.innerHTML = `
                    ${symbol.icon}
                    <span class="symbol-tooltip">${symbol.name}</span>
                `;
                
                btn.addEventListener('click', () => selectSymbol(category, symbol.id));
                grid.appendChild(btn);
            });
        });
    }

    // --- プリセットボタンの描画 ---
    function renderPresets() {
        presetsContainer.innerHTML = '';
        PRESETS.forEach(preset => {
            const tag = document.createElement('button');
            tag.className = 'preset-tag';
            tag.textContent = preset.name;
            tag.addEventListener('click', () => applyPreset(preset));
            presetsContainer.appendChild(tag);
        });
    }

    // --- 記号の選択処理 ---
    function selectSymbol(category, id) {
        if (state.selected[category] === id) {
            // トグル（同じものを押したら解除）
            state.selected[category] = null;
        } else {
            state.selected[category] = id;
        }
        saveStateToStorage();
        updateUI();
    }

    // --- プリセットの適用 ---
    function applyPreset(preset) {
        state.selected = { ...preset.symbols };
        saveStateToStorage();
        updateUI();
    }

    // --- リセット ---
    function resetSelection() {
        state.selected = { wash: null, bleach: null, tumble: null, 'natural-dry': null, iron: null, cleaning: null };
        recipeNameInput.value = '';
        saveStateToStorage();
        updateUI();
    }

    // --- UIの全更新 ---
    function updateUI() {
        // 1. 各グリッドボタンの選択状態(アクティブ化)の更新
        Object.keys(SYMBOLS_DATA).forEach(category => {
            const grid = document.getElementById(`grid-${category}`);
            const buttons = grid.querySelectorAll('.symbol-btn');
            buttons.forEach(btn => {
                if (state.selected[category] === btn.dataset.id) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        });

        // 2. 選択中プレビューの更新
        renderPreview();

        // 3. 手順タイムラインの生成
        generateProcedure();

        // 4. 保存されたレシピリストの更新
        renderSavedRecipes();
    }

    // --- プレビュー表示 ---
    function renderPreview() {
        selectedPreview.innerHTML = '';
        let hasSelection = false;

        Object.keys(state.selected).forEach(category => {
            const selectedId = state.selected[category];
            if (selectedId) {
                hasSelection = true;
                const symbolObj = SYMBOLS_DATA[category].find(s => s.id === selectedId);
                if (symbolObj) {
                    const iconWrap = document.createElement('div');
                    iconWrap.className = 'preview-icon';
                    iconWrap.innerHTML = symbolObj.icon;
                    iconWrap.title = symbolObj.name;
                    selectedPreview.appendChild(iconWrap);
                }
            }
        });

        if (!hasSelection) {
            selectedPreview.innerHTML = '<div class="preview-empty">左側の記号をタップして選択してください</div>';
        }
    }

    // --- 自動お手入れ手順生成エンジン ---
    function generateProcedure() {
        procedureTimeline.innerHTML = '';
        const selected = state.selected;

        // 選択がない場合のアナウンス
        const hasSelection = Object.values(selected).some(val => val !== null);
        if (!hasSelection) {
            procedureTimeline.innerHTML = `
                <div style="text-align: center; padding: 2rem 0; color: var(--text-secondary);">
                     <p style="font-size: 1.5rem; margin-bottom: 0.5rem;">🧺</p>
                     <p>衣類のタグに並んでいる記号を選択すると、ここに最適な手順書が生成されます。</p>
                </div>
            `;
            return;
        }

        // --- STEP 1: 洗い方 ---
        if (selected.wash) {
            const item = SYMBOLS_DATA.wash.find(s => s.id === selected.wash);
            let washText = item.desc;
            let advice = item.advice;

            // 漂白との組み合わせによるアドバイス補足
            if (selected.bleach === 'bleach-prohibit' && selected.wash !== 'wash-prohibit') {
                advice += ' また、漂白剤は使用できませんので、通常のデリケート衣類用洗剤（中性）をご使用ください。';
            }

            addTimelineItem('💧 STEP 1: 洗い方（家庭洗濯）', washText, advice);
        } else {
            addTimelineItem('💧 STEP 1: 洗い方（家庭洗濯）', '表示がありません。', '一般的な衣類として、40℃以下の水温で通常の洗濯が可能です。デリケート素材の疑いがある場合は、手洗いを推奨します。');
        }

        // --- STEP 2: シミ抜き・漂白 ---
        if (selected.bleach) {
            const item = SYMBOLS_DATA.bleach.find(s => s.id === selected.bleach);
            addTimelineItem('🧪 STEP 2: シミ抜き・漂白', item.desc, item.advice);
        }

        // --- STEP 3: 脱水・乾燥 ---
        let dryDesc = '';
        let dryAdvice = '';

        if (selected.tumble === 'tumble-prohibit') {
            dryDesc = '乾燥機（タンブル乾燥）は使用できません。';
            dryAdvice = '<span class="warning-text">【厳禁】熱による縮みが起きるため、乾燥機は絶対に使用せず、必ず自然乾燥をしてください。</span>';
        } else if (selected.tumble) {
            const item = SYMBOLS_DATA.tumble.find(s => s.id === selected.tumble);
            dryDesc = item.desc;
            dryAdvice = item.advice;
        }

        if (selected['natural-dry']) {
            const item = SYMBOLS_DATA['natural-dry'].find(s => s.id === selected['natural-dry']);
            dryDesc += (dryDesc ? ' ' : '') + item.desc;
            dryAdvice += (dryAdvice ? '<br>' : '') + item.advice;
        }

        if (dryDesc) {
            addTimelineItem('☀️ STEP 3: 乾燥（干し方）', dryDesc, dryAdvice);
        } else {
            addTimelineItem('☀️ STEP 3: 乾燥（干し方）', '乾燥方法の指定がありません。', '風通しの良い日陰での吊り干しが、最も衣類にダメージを与えない安全な干し方です。');
        }

        // --- STEP 4: アイロン仕上げ ---
        if (selected.iron) {
            const item = SYMBOLS_DATA.iron.find(s => s.id === selected.iron);
            addTimelineItem('🔌 STEP 4: アイロン仕上げ', item.desc, item.advice);
        }

        // --- STEP 5: プロへの相談（クリーニング） ---
        if (selected.cleaning) {
            const item = SYMBOLS_DATA.cleaning.find(s => s.id === selected.cleaning);
            addTimelineItem('👔 STEP 5: クリーニング店への依頼', item.desc, item.advice);
        }
    }

    // タイムラインアイテム追加ヘルパー
    function addTimelineItem(title, desc, advice) {
        const item = document.createElement('div');
        item.className = 'timeline-item';
        item.innerHTML = `
            <div class="timeline-title">${title}</div>
            <div class="timeline-desc">
                <p style="font-weight: 600; color: var(--text-primary); margin-bottom: 0.25rem;">${desc}</p>
                <p style="font-size: 0.813rem; padding: 0.5rem; background-color: var(--bg-primary); border-radius: var(--radius-sm); border-left: 3px solid var(--accent-color); margin-top:0.25rem;">${advice}</p>
            </div>
        `;
        procedureTimeline.appendChild(item);
    }

    // --- レシピの保存機能 ---
    function saveRecipe() {
        const name = recipeNameInput.value.trim();
        if (!name) {
            alert('衣類の名前（例: お気に入りのセーター）を入力してください。');
            return;
        }

        const hasSelection = Object.values(state.selected).some(val => val !== null);
        if (!hasSelection) {
            alert('洗濯表示の記号を1つ以上選択してください。');
            return;
        }

        const newRecipe = {
            id: Date.now(),
            name: name,
            symbols: { ...state.selected }
        };

        state.savedRecipes.push(newRecipe);
        saveRecipesToStorage();
        recipeNameInput.value = '';
        updateUI();
    }

    // --- 保存されたレシピの削除 ---
    function deleteRecipe(id, event) {
        event.stopPropagation(); // 親のクリックイベント（レシピロード）を防ぐ
        state.savedRecipes = state.savedRecipes.filter(recipe => recipe.id !== id);
        saveRecipesToStorage();
        updateUI();
    }

    // --- 保存されたレシピの読み込み ---
    function loadRecipe(recipe) {
        state.selected = { ...recipe.symbols };
        recipeNameInput.value = recipe.name;
        saveStateToStorage();
        updateUI();
    }

    // --- 保存レシピリストの描画 ---
    function renderSavedRecipes() {
        savedRecipesList.innerHTML = '';
        if (state.savedRecipes.length === 0) {
            savedRecipesList.innerHTML = '<li style="color: var(--text-secondary); font-size: 0.813rem; text-align: center; padding: 1rem 0;">保存されたレシピはまだありません</li>';
            return;
        }

        state.savedRecipes.forEach(recipe => {
            const li = document.createElement('li');
            li.className = 'recipe-item';
            
            const info = document.createElement('div');
            info.className = 'recipe-info';
            info.textContent = recipe.name;
            info.addEventListener('click', () => loadRecipe(recipe));

            const delBtn = document.createElement('button');
            delBtn.className = 'recipe-delete';
            delBtn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>`;
            delBtn.addEventListener('click', (e) => deleteRecipe(recipe.id, e));

            li.appendChild(info);
            li.appendChild(delBtn);
            savedRecipesList.appendChild(li);
        });
    }

    // 起動
    window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
